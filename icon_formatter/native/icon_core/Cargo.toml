[package]
name = "icon_core"
version = "1.4.0"
edition = "2021"
description = "Icon Formatter shared image-processing core (segmentation, composition, calibration, batch, pack cleanup)"
license = "AGPL-3.0-only"

[lib]
path = "src/lib.rs"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
fast_image_resize = "5"
rayon = "1.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
walkdir = "2"
tract-onnx = "0.23"

[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
